<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <div class="box">
        <form action="">
            <fieldset>
                <legend>Cadastrar-se</legend>

                <div class="inputbox">
                    <input type="text" name="nome" id="nome" class="inputUser" required>
                    <label for="nome">Nome Completo</label>
                </div>

                <div class="inputbox">
                    <input type="text" name="documento" id="documento" class="inputUser" oninput="mascaraDinamica(this)" maxlength="18" inputmode="numeric" required>
                    <label for="documento">CPF ou CNPJ</label>
                </div>

                <div class="inputbox">
                    <input type="tel" name="celular" id="celular" class="inputUser" placeholder="(00) 00000-0000" maxlength="15" onkeyup="mascaraCelular(this)" required>
                    <label for="celular">Celular</label>
                </div>

                <div class="inputbox">
                    <input type="email" name="email" id="email" class="inputUser" required>
                    <label for="email">Email</label>
                </div>

                <div>
                    <p>Sexo:</p>
                    <input type="radio" id="feminino" name="genero" value="feminino" required>
                    <label for="feminino">Feminino</label>
                    <input type="radio" id="masculino" name="genero" value="masculino" required>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="outro" name="genero" value="outro" required>
                    <label for="outro">Outro</label>
                </div>

                <div class="inputbox">
                    <label for="data_nascimento">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" id="data_nascimento" class="inputUser" required>
                </div>

                <div class="inputbox">
                    <input type="text" name="endereco" id="endereco" class="inputUser" required>
                    <label for="endereco">Endereço</label>
                </div>
                
                <div class="inputbox">
                <input type="text" name="numero" id="numero" class="inputUser" inputmode="numeric" required>
                <label for="numero">Número</label>
                </div>

                <div class="inputbox">
                    <input type="text" name="bairro" id="bairro" class="inputUser" required>
                    <label for="bairro">Bairro</label>
                </div>

                <div class="inputbox">
                    <input type="text" name="cep" id="cep" class="inputUser" 
                    oninput="mascaraCEP(this)" maxlength="9" inputmode="numeric" 
                    placeholder="00000-000" required>
                    <label for="cep">CEP</label>
                </div>

                <div class="inputbox">
                    <input type="text" name="cidade" id="cidade" class="inputUser" required>
                    <label for="cidade">Cidade</label>
                </div>
                
                <div class="inputbox">
                    <input type="text" name="Estado" id="Estado" class="inputUser" required>
                    <label for="Estado">Estado</label>
                </div>

                <input type="submit" name="submit" id="submit">

            </fieldset>
        </form>
    </div>

    <!-- Formatação CPF/CNPJ, Celular e CEP -->
    <script>
        function mascaraDinamica(input) {
            let v = input.value.replace(/\D/g, ''); 
            if (v.length <= 11) {
                if (v.length > 3) v = v.substring(0, 3) + '.' + v.substring(3);
                if (v.length > 7) v = v.substring(0, 7) + '.' + v.substring(7);
                if (v.length > 11) v = v.substring(0, 11) + '-' + v.substring(11);
            } else {
                if (v.length > 2) v = v.substring(0, 2) + '.' + v.substring(2);
                if (v.length > 6) v = v.substring(0, 6) + '.' + v.substring(6);
                if (v.length > 10) v = v.substring(0, 10) + '/' + v.substring(10);
                if (v.length > 15) v = v.substring(0, 15) + '-' + v.substring(15);
            }
            input.value = v;
        }

        function mascaraCelular(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d{5})(\d)/, "$1-$2"); 
            input.value = v;
        }

        function mascaraCEP(input) {
            let v = input.value.replace(/\D/g, ""); // Remove tudo que não é número
            v = v.replace(/^(\d{5})(\d)/, "$1-$2"); // Coloca o hífen após o quinto dígito
            input.value = v;
        }

    </script>
</body>
</html>
